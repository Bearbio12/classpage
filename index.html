<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>燕麥熊班級經營系統 (雲端升級版)</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #fdf6e3; padding: 20px; text-align: center; }
        h1 { color: #8b5a2b; }
        .controls { margin-bottom: 20px; }
        button { background-color: #8b5a2b; color: white; border: none; padding: 10px 20px; border-radius: 5px; cursor: pointer; font-size: 16px; margin: 5px; }
        button:hover { background-color: #a0522d; }
        .grid { display: flex; flex-wrap: wrap; justify-content: center; gap: 20px; }
        .card { background: white; padding: 15px; border-radius: 15px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); width: 150px; text-align: center; border: 2px solid #eaddcf; }
        .card img { width: 100px; height: 100px; border-radius: 50%; object-fit: cover; background-color: #eee; margin-bottom: 10px; }
        .score { font-size: 24px; font-weight: bold; color: #d2691e; margin: 10px 0; }
        .btn-group button { padding: 5px 15px; font-size: 18px; margin: 0 5px; background-color: #eaddcf; color: #555; }
        .btn-group button:hover { background-color: #d2b48c; color: white; }
        
        /* 新增學生視窗 */
        #addModal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); justify-content: center; align-items: center; }
        .modal-content { background: white; padding: 30px; border-radius: 15px; width: 300px; text-align: left; }
        .modal-content input { width: 90%; padding: 10px; margin: 10px 0; border: 1px solid #ccc; border-radius: 5px; }
        .modal-content label { font-weight: bold; color: #555; font-size: 14px; }
        .hint { font-size: 12px; color: #888; margin-bottom: 15px; display: block; }
    </style>
</head>
<body>

    <h1>🐻 燕麥熊班級經營系統</h1>
    <div class="controls">
        <button onclick="document.getElementById('addModal').style.display='flex'">➕ 新增學生</button>
    </div>

    <div class="grid" id="studentGrid">
        <!-- 學生卡片會產生在這裡 -->
    </div>

    <!-- 新增/編輯學生的視窗 -->
    <div id="addModal">
        <div class="modal-content">
            <h3 style="margin-top:0; color:#8b5a2b;">新增學生</h3>
            
            <label>學生姓名 / 座號</label>
            <input type="text" id="studentName" placeholder="例如：1號 王小明">
            
            <label>大頭貼網址 (選填)</label>
            <input type="text" id="studentPhotoUrl" placeholder="請貼上圖片的網址 (結尾通常是 .jpg 或 .png)">
            <span class="hint">💡 推薦使用 Postimages.org 取得免費圖片網址。若不填寫將使用預設燕麥熊。</span>
            
            <div style="text-align: right; margin-top: 20px;">
                <button style="background-color: #ccc; color: #333;" onclick="document.getElementById('addModal').style.display='none'">取消</button>
                <button onclick="saveStudent()">儲存加入</button>
            </div>
        </div>
    </div>

    <!-- 🔥 Firebase 雲端同步大腦 -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";
        import { getAuth, signInAnonymously } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js";
        import { getFirestore, doc, setDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js";

        // 您的專屬 Firebase 金鑰 (已幫您設定好)
        const firebaseConfig = {
            apiKey: "AIzaSyBnBPNkKIT5CjhGHxVGtkS9QF5eXcvmPOI",
            authDomain: "classpage-527d3.firebaseapp.com",
            projectId: "classpage-527d3",
            storageBucket: "classpage-527d3.firebasestorage.app",
            messagingSenderId: "370557708677",
            appId: "1:370557708677:web:9891f9cbee8aa6d334bcec",
            measurementId: "G-2KVJRQ04WY"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        let students = [];

        // 預設的燕麥熊圖片網址
        const defaultBearImg = "https://cdn-icons-png.flaticon.com/512/3069/3069172.png";

        // 1. 匿名登入
        signInAnonymously(auth).then(() => {
            console.log("雲端連線成功！");
            
            // 2. 監聽雲端資料庫 (即時同步)
            onSnapshot(doc(db, "classData", "students"), (docSnap) => {
                if (docSnap.exists()) {
                    students = docSnap.data().list || [];
                    renderStudents();
                }
            });
        }).catch((error) => {
            alert("雲端連線失敗，請確認 Firebase 匿名登入是否已開啟。");
        });

        // 渲染學生畫面
        window.renderStudents = function() {
            const grid = document.getElementById('studentGrid');
            grid.innerHTML = '';
            students.forEach((student, index) => {
                // 如果沒有填寫圖片網址，就用預設的燕麥熊
                const imgSrc = student.photoUrl ? student.photoUrl : defaultBearImg;
                
                grid.innerHTML += `
                    <div class="card">
                        <img src="${imgSrc}" alt="student photo" onerror="this.src='${defaultBearImg}'">
                        <div style="font-weight: bold; color: #555;">${student.name}</div>
                        <div class="score">${student.score}</div>
                        <div class="btn-group">
                            <button onclick="updateScore(${index}, 1)">+1</button>
                            <button onclick="updateScore(${index}, -1)">-1</button>
                        </div>
                    </div>
                `;
            });
        };

        // 新增學生
        window.saveStudent = function() {
            const name = document.getElementById('studentName').value;
            const photoUrl = document.getElementById('studentPhotoUrl').value;
            
            if (!name) return alert("請輸入學生姓名！");
            
            students.push({
                name: name,
                photoUrl: photoUrl.trim(), // 儲存純文字的圖片網址
                score: 0
            });
            
            saveToCloud();
            
            // 清空並關閉視窗
            document.getElementById('studentName').value = '';
            document.getElementById('studentPhotoUrl').value = '';
            document.getElementById('addModal').style.display = 'none';
        };

        // 加扣分
        window.updateScore = function(index, change) {
            students[index].score += change;
            saveToCloud();
        };

        // 寫入 Firebase
        function saveToCloud() {
            setDoc(doc(db, "classData", "students"), { list: students })
                .catch(error => console.error("儲存失敗: ", error));
        }
    </script>
</body>
</html>
